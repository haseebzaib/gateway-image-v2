# METABEGIN
# X-Env-Layer-Name: metacrust-services
# X-Env-Layer-Category: metacrust
# X-Env-Layer-Desc: MetaCrust gateway_core (built from source) and gateway_hub (copied) runtime services
# X-Env-Layer-Requires: metacrust-layout,metacrust-network-runtime
# METAEND
---
mmdebstrap:
  customize-hooks:
    - |-
      set -eu
      "$SRCROOT/system_related/services/build-install-gateway-core.sh" "$1"
      "$SRCROOT/system_related/services/install-gateway-hub.sh" "$1"
      install -D -m 0644 "$SRCROOT/system_related/services/metacrust-core.service" "$1/etc/systemd/system/metacrust-core.service"
      install -D -m 0644 "$SRCROOT/system_related/services/metacrust-hub.service" "$1/etc/systemd/system/metacrust-hub.service"
    - $BDEBSTRAP_HOOKS/enable-units "$1" metacrust-core metacrust-hub
