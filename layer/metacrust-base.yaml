# METABEGIN
# X-Env-Layer-Name: metacrust-base
# X-Env-Layer-Category: metacrust
# X-Env-Layer-Desc: MetaCrust gateway v2 development/runtime base packages
# X-Env-Layer-Requires: trixie-minbase
# METAEND
---
mmdebstrap:
  packages:
    - ca-certificates
    - git
    - curl
    - wget
    - vim
    - less
    - rsync
    - tmux
    - jq
    - tree
    - unzip
    - zip
    - htop
    - zstd
    - sudo

    - openssh-server
    - dnsutils
    - ethtool
    - traceroute
    - mtr-tiny
    - tcpdump
    - iperf3
    - nmap
    - ncat
    - socat

    - usbutils
    - pciutils
    - lm-sensors

    - picocom
    - minicom
    - i2c-tools
    - spi-tools
    - gpiod

    - build-essential
    - cmake
    - g++
    - ninja-build
    - pkg-config
    - python3-dev
    - python3-venv
    - python3-pip
    - patchelf
    - ccache
    - gdb
    - strace
    - ltrace
    - valgrind
    - clang
    - clangd
    - libboost-dev
    - libboost-system-dev
    - sqlite3
    - libsqlite3-dev
    - redis
    - redis-server
    - sqlcipher
    - libsqlcipher-dev
    - libmodbus-dev
    - libserialport-dev
    - libi2c-dev
    - libgpiod-dev

    - iproute2
    - iputils-ping
    - cloud-guest-utils
    - e2fsprogs
    - iw
    - wireless-regdb
    - wpasupplicant
    - hostapd
    - dnsmasq
    - iptables
    - nftables
    - snmp
    - libqmi-utils
    - udhcpc
    - modemmanager

    - python3
    - python3-fastapi
    - python3-httpx
    - python3-jinja2
    - python3-uvicorn
    - python3-itsdangerous
    - python3-paho-mqtt

    - util-linux-extra
  customize-hooks:
    - |-
      set -eu
      chroot "$1" python3 -m pip install --break-system-packages --no-cache-dir 'sqlcipher3>=0.6,<1.0'
      install -d -m 0755 "$1/etc/sudoers.d"
      install -D -m 0440 "$SRCROOT/system_related/sudoers/gateway-metacrust" "$1/etc/sudoers.d/gateway-metacrust"
