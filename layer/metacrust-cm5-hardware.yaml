# METABEGIN
# X-Env-Layer-Name: metacrust-cm5-hardware
# X-Env-Layer-Category: metacrust
# X-Env-Layer-Desc: CM5 carrier hardware enablement for RTC, UARTs, GPIO I/O
# X-Env-Layer-Requires: metacrust-layout
# METAEND
---
mmdebstrap:
  packages:
    - util-linux-extra
  customize-hooks:
    - |-
      set -eu
      install -D -m 0755 "$SRCROOT/system_related/hardware/gateway-cm5-hardware-status.sh" "$1/opt/metacrust/bin/gateway-cm5-hardware-status.sh"
      install -D -m 0755 "$SRCROOT/system_related/hardware/gateway-cm5-ioctl" "$1/opt/metacrust/bin/gateway-cm5-ioctl"
      install -D -m 0755 "$SRCROOT/system_related/hardware/gateway-cm5-boot-chirp.sh" "$1/opt/metacrust/bin/gateway-cm5-boot-chirp.sh"
      install -D -m 0755 "$SRCROOT/system_related/hardware/gateway-cm5-rtc-load.sh" "$1/opt/metacrust/bin/gateway-cm5-rtc-load.sh"
      install -D -m 0755 "$SRCROOT/system_related/hardware/gateway-cm5-rtc-save.sh" "$1/opt/metacrust/bin/gateway-cm5-rtc-save.sh"
      install -D -m 0644 "$SRCROOT/system_related/hardware/gateway-cm5-boot-chirp.service" "$1/etc/systemd/system/gateway-cm5-boot-chirp.service"
      install -D -m 0644 "$SRCROOT/system_related/hardware/gateway-cm5-rtc-load.service" "$1/etc/systemd/system/gateway-cm5-rtc-load.service"
      install -D -m 0644 "$SRCROOT/system_related/hardware/gateway-cm5-rtc-save.service" "$1/etc/systemd/system/gateway-cm5-rtc-save.service"
      install -D -m 0644 "$SRCROOT/system_related/hardware/README.md" "$1/opt/metacrust/etc/cm5-hardware.md"
      config="$1/boot/firmware/config.txt"
      if ! grep -q 'BEGIN MetaCrust CM5 hardware' "$config"; then
        printf '\n# BEGIN MetaCrust CM5 hardware\n' >> "$config"
        printf '[cm5]\n' >> "$config"
        printf 'enable_uart=1\n' >> "$config"
        printf 'dtoverlay=uart2-pi5\n' >> "$config"
        printf 'dtoverlay=uart3-pi5\n' >> "$config"
        printf 'dtoverlay=uart4-pi5\n' >> "$config"
        printf 'dtoverlay=uart0-pi5\n' >> "$config"
        printf '# END MetaCrust CM5 hardware\n' >> "$config"
      fi
      cmdline="$1/boot/firmware/cmdline.txt"
      sed -i 's/console=serial0,115200 //g' "$cmdline"
    - $BDEBSTRAP_HOOKS/enable-units "$1" gateway-cm5-rtc-load gateway-cm5-rtc-save gateway-cm5-boot-chirp
