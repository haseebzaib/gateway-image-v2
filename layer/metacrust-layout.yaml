# METABEGIN
# X-Env-Layer-Name: metacrust-layout
# X-Env-Layer-Category: metacrust
# X-Env-Layer-Desc: MetaCrust /opt/metacrust runtime layout
# X-Env-Layer-Requires: metacrust-base
# METAEND
---
mmdebstrap:
  customize-hooks:
    - |-
      set -eu
      install -d -m 0755 "$1/opt/metacrust"
      install -d -m 0755 "$1/opt/metacrust/scripts"
      install -d -m 0755 "$1/opt/metacrust/gateway_core"
      install -d -m 0755 "$1/opt/metacrust/gateway_hub"
      install -d -m 0755 "$1/persistent/metacrust"
      install -d -m 0700 "$1/persistent/metacrust/secrets"
      install -d -m 0700 "$1/persistent/metacrust/data"
      install -d -m 0700 "$1/persistent/metacrust/data/edge_server"
      install -d -m 0755 "$1/persistent/metacrust/log"
      install -d -m 0755 "$1/persistent/metacrust/state"
      ln -sfn /persistent/metacrust/secrets "$1/opt/metacrust/secrets"
      ln -sfn /persistent/metacrust/data "$1/opt/metacrust/data"
      ln -sfn /persistent/metacrust/log "$1/opt/metacrust/log"
      ln -sfn /persistent/metacrust/state "$1/opt/metacrust/state"
      install -D -m 0755 "$SRCROOT/system_related/startup/metacrust-layout.sh" "$1/opt/metacrust/scripts/metacrust-layout.sh"
      install -D -m 0644 "$SRCROOT/system_related/startup/metacrust-layout.service" "$1/etc/systemd/system/metacrust-layout.service"
    - $BDEBSTRAP_HOOKS/enable-units "$1" metacrust-layout
